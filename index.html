<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missão Ciências — Matheus</title>
<style>
:root{--bg:#07111f;--card:#0e1d31;--text:#f4f8ff;--muted:#a9bbd2;--accent:#42d9ff;--accent2:#7c5cff;--good:#34d399;--bad:#fb7185}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at top,#16355a,#07111f 55%);color:var(--text);min-height:100vh}
.app{max-width:820px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.logo{font-weight:900;letter-spacing:.5px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#10243d;border:1px solid #244565;border-radius:999px;padding:8px 12px;font-weight:700}
.progress{height:10px;background:#0b192b;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
.card{background:linear-gradient(145deg,var(--card),#0b182a);border:1px solid #24405f;border-radius:24px;padding:28px;box-shadow:0 18px 55px #0006}
.badge{display:inline-block;color:#08111c;background:var(--accent);font-weight:900;padding:6px 10px;border-radius:9px;font-size:.78rem}
h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1;margin:16px 0 10px}.sub{color:var(--muted);line-height:1.6}.question{font-size:1.35rem;font-weight:800;line-height:1.4;margin:24px 0}
.answers{display:grid;gap:12px}.answer{width:100%;padding:16px;text-align:left;border-radius:15px;border:1px solid #315271;background:#10243b;color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;transition:.15s}.answer:hover{transform:translateY(-2px);border-color:var(--accent);background:#15304e}.answer:disabled{cursor:default;opacity:1}.answer.correct{border-color:var(--good);background:#0d3a31}.answer.wrong{border-color:var(--bad);background:#451f2b}
.feedback{margin-top:16px;padding:14px;border-radius:14px;background:#091727;color:#dce8f6;line-height:1.5;display:none}.feedback.show{display:block}.next{margin-top:18px;width:100%;padding:15px;border:0;border-radius:15px;background:linear-gradient(90deg,var(--accent2),#4d8dff);color:white;font-size:1rem;font-weight:900;cursor:pointer;display:none}.next.show{display:block}
.screen{text-align:center}.start{margin-top:22px;padding:16px 25px;border:0;border-radius:15px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#06101b;font-weight:900;font-size:1rem;cursor:pointer}.result{font-size:4rem;font-weight:1000;margin:15px}.review{margin-top:20px;text-align:left;background:#091727;padding:16px;border-radius:15px}
@media(max-width:560px){.app{padding:14px}.card{padding:20px}.question{font-size:1.15rem}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">MISSÃO CIÊNCIAS</div><div class="stats"><span class="pill">⭐ <span id="score">0</span> pontos</span><span class="pill">❤️ <span id="lives">3</span></span></div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="game"><div class="screen"><span class="badge">DESAFIO DO MATHEUS</span><h1>Ciências: modo game</h1>
<p class="sub">30 desafios baseados nos conteúdos das provas enviadas: animais, plantas, materiais, passado e presente, eletricidade, segurança, saúde e laboratório.</p>
<button class="start" onclick="startGame()">COMEÇAR MISSÃO</button></div></div>
</div>
<script>
const questions=[{"q": "O Lorax é parecido com um macaco. A qual grupo zoológico o macaco pertence?", "a": ["Mamíferos", "Aves", "Peixes", "Répteis"], "c": 0, "e": "Macacos pertencem ao grupo dos mamíferos."}, {"q": "Qual animal pertence ao mesmo grupo zoológico dos macacos?", "a": ["Urso", "Pato", "Galinha", "Peixe"], "c": 0, "e": "O urso também é mamífero, assim como o macaco."}, {"q": "As plantas são seres vivos. Qual característica ajuda a justificar essa afirmação?", "a": ["Crescem e se desenvolvem", "São feitas de plástico", "Nunca mudam", "Não precisam de água"], "c": 0, "e": "Plantas crescem e se desenvolvem, características de seres vivos."}, {"q": "Para se desenvolver, uma planta precisa de quais elementos básicos?", "a": ["Água, luz e nutrientes", "Plástico, tinta e cola", "Metal, vidro e papel", "Somente ar artificial"], "c": 0, "e": "Água, luz e nutrientes são elementos importantes para o desenvolvimento das plantas."}, {"q": "A madeira do cabo de um machado quebra quando é dobrada. Ela é classificada, nessa situação, como:", "a": ["Rígida", "Flexível", "Transparente", "Impermeável"], "c": 0, "e": "O enunciado diz que a madeira quebra quando dobrada, indicando rigidez."}, {"q": "O metal do machado não permite ver o que existe dentro dele. Esse metal é:", "a": ["Opaco", "Transparente", "Elástico", "Flexível"], "c": 0, "e": "Um material através do qual não conseguimos ver é opaco."}, {"q": "Uma roupa impermeável é aquela que:", "a": ["Não permite a passagem de água", "Permite a passagem de água", "É sempre transparente", "Pode ser feita somente de metal"], "c": 0, "e": "Impermeável significa que a água não atravessa o material."}, {"q": "Qual objeto um jardineiro deve utilizar para cuidar das plantas?", "a": ["Regador", "Pincel", "Espelho", "Microfone"], "c": 0, "e": "O regador é usado para fornecer água às plantas."}, {"q": "Por que é importante guardar os objetos nos lugares certos?", "a": ["Para manter o ambiente organizado e seguro", "Para deixar tudo espalhado", "Para impedir a circulação", "Para aumentar os riscos de acidentes"], "c": 0, "e": "Organizar os objetos ajuda a manter o ambiente organizado e seguro."}, {"q": "Qual objeto pode ser usado para iluminar uma casa que não possui energia elétrica?", "a": ["Vela", "Televisão", "Liquidificador", "Computador"], "c": 0, "e": "A vela pode iluminar sem depender de energia elétrica."}, {"q": "Qual objeto de uma cozinha atual depende de energia elétrica para funcionar?", "a": ["Liquidificador", "Colher de madeira", "Panela simples", "Prato"], "c": 0, "e": "O liquidificador é um eletrodoméstico que depende de eletricidade."}, {"q": "Os colchões das camas de antigamente costumavam ser feitos de:", "a": ["Palha ou capim seco", "Espuma", "Plástico", "Papel"], "c": 0, "e": "A prova apresenta palha ou capim seco como material dos colchões antigos."}, {"q": "Qual cuidado uma criança deve ter ao andar de bicicleta?", "a": ["Utilizar equipamentos de segurança", "Andar no meio dos carros", "Pedalar em locais perigosos", "Nunca estar acompanhada por um adulto"], "c": 0, "e": "Equipamentos de segurança ajudam a proteger a criança durante o passeio."}, {"q": "Qual atitude é segura diante de um equipamento que precisa ser ligado à tomada?", "a": ["Chamar um adulto para ajudar", "Colocar objetos na tomada", "Usar a tomada com a mão molhada", "Puxar o fio com força"], "c": 0, "e": "A prova orienta que a criança deve chamar um adulto para ajudar com a tomada."}, {"q": "Qual objeto observado no laboratório possui maior tenacidade entre as opções da prova?", "a": ["Placa de alumínio", "Saco plástico", "Algodão", "Borracha"], "c": 0, "e": "Na questão do laboratório, a placa de alumínio é a alternativa indicada como de maior tenacidade."}, {"q": "Nas salas do passado, uma característica apresentada na prova é que elas eram diferentes das atuais. Qual comparação está correta?", "a": ["Tinham menos recursos elétricos do que muitas salas atuais", "Tinham sempre computadores", "Tinham sempre televisores modernos", "Tinham sempre aparelhos eletrônicos"], "c": 0, "e": "A prova destaca que poucas habitações do passado possuíam eletricidade."}, {"q": "O que as pessoas utilizavam para iluminar ambientes de casas que não tinham eletricidade?", "a": ["Velas ou outras fontes de iluminação sem eletricidade", "Computadores", "Televisores", "Liquidificadores"], "c": 0, "e": "A questão trabalha formas de iluminação usadas quando não havia eletricidade."}, {"q": "Sobre as cozinhas do passado e do presente, qual afirmação está correta?", "a": ["Fogões muito antigos utilizavam lenha para preparar alimentos", "As cozinhas antigas tinham muitos eletrodomésticos modernos", "As cozinhas atuais só usam objetos de barro", "Nas cozinhas antigas não havia objetos de madeira"], "c": 0, "e": "A prova afirma que fogões muito antigos utilizavam lenha."}, {"q": "O pássaro tropical encontrado por Russell pertence a qual grupo zoológico?", "a": ["Aves", "Mamíferos", "Peixes", "Répteis"], "c": 0, "e": "O animal descrito é um pássaro, portanto pertence ao grupo das aves."}, {"q": "Além de embelezar o pássaro, as penas cobrem e protegem seu corpo. Qual alternativa apresenta essa função?", "a": ["Proteção do corpo", "Produção de eletricidade", "Substituição dos ossos", "Função de dentes"], "c": 0, "e": "As penas são estruturas que cobrem o corpo das aves e contribuem para sua proteção."}, {"q": "Por que Russell não podia se aproximar do forno aceso?", "a": ["Porque o forno quente poderia causar queimaduras", "Porque o forno produziria água", "Porque o bolo ficaria frio", "Porque o forno deixaria de funcionar"], "c": 0, "e": "Um forno aceso fica muito quente e pode causar queimaduras."}, {"q": "Qual atitude ajuda a evitar acidentes com eletricidade?", "a": ["Chamar um adulto para ligar o computador na tomada", "Colocar objetos na tomada", "Usar celular ligado à tomada de qualquer maneira", "Desligar a televisão com a mão molhada"], "c": 0, "e": "A alternativa segura apresentada pela prova é chamar um adulto para ajudar."}, {"q": "Por que é importante manter os ambientes da casa organizados?", "a": ["Para facilitar a circulação e ajudar a evitar acidentes", "Para deixar objetos espalhados", "Para dificultar a circulação", "Para aumentar os riscos"], "c": 0, "e": "A organização ajuda na circulação e contribui para a segurança."}, {"q": "Qual objeto pode estar presente em mais de um ambiente da casa e desempenhar funções diferentes?", "a": ["Televisão", "Chuveiro", "Quadro", "Cama"], "c": 0, "e": "A questão da prova trabalha objetos que podem aparecer em diferentes ambientes; a televisão é um exemplo."}, {"q": "Russell quer trabalhar cuidando da saúde das pessoas e ajudando a tratar doenças. Qual profissão corresponde a esse objetivo?", "a": ["Médico", "Jardineiro", "Cozinheiro", "Motorista"], "c": 0, "e": "A profissão relacionada a cuidar da saúde e tratar doenças é a de médico."}, {"q": "Qual objeto um profissional da saúde pode utilizar em seu trabalho?", "a": ["Estetoscópio", "Regador", "Panela", "Colchonete"], "c": 0, "e": "O estetoscópio é um instrumento utilizado por profissionais da saúde."}, {"q": "O material de um balão pode esticar, encolher e voltar à forma inicial. Essa propriedade é chamada de:", "a": ["Elasticidade", "Maciez", "Rigidez", "Transparência"], "c": 0, "e": "A capacidade de voltar à forma inicial depois de esticado ou deformado é elasticidade."}, {"q": "Na mochila de Russell há corneta, caneca, panela, colchonete e corda. Quais objetos podem ser feitos de metal?", "a": ["Corneta, caneca e panela", "Colchonete e corda", "Somente o colchonete", "Somente a corda"], "c": 0, "e": "Corneta, caneca e panela são os objetos citados que podem ser feitos de metal."}, {"q": "Qual objeto flexível foi citado na mochila de Russell?", "a": ["Corda", "Panela", "Corneta", "Caneca"], "c": 0, "e": "A corda é um objeto que pode ser flexível."}, {"q": "No experimento do laboratório, quais substâncias foram misturadas para liberar um gás?", "a": ["Vinagre e bicarbonato de sódio", "Sal e água", "Açúcar e vinagre", "Água e açúcar"], "c": 0, "e": "A prova apresenta vinagre e bicarbonato de sódio como a mistura do experimento que liberou gás."}];
let index=0,score=0,lives=3,answered=false,results=[];
const game=document.getElementById('game');
function startGame(){index=0;score=0;lives=3;results=[];render()}
function render(){answered=false;const q=questions[index];document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('bar').style.width=(index/questions.length*100)+'%';
game.innerHTML='<span class="badge">FASE '+(index+1)+' DE '+questions.length+'</span><div class="question">'+q.q+'</div><div class="answers">'+q.a.map((x,i)=>'<button class="answer" onclick="answer('+i+',this)"><b>'+String.fromCharCode(65+i)+'.</b> '+x+'</button>').join('')+'</div><div class="feedback" id="feedback"></div><button class="next" id="next" onclick="nextQuestion">'+(index===questions.length-1?'VER RESULTADO':'PRÓXIMA FASE →')+'</button>';
document.getElementById('next').onclick=nextQuestion}
function answer(choice,btn){if(answered)return;answered=true;const q=questions[index],buttons=[...document.querySelectorAll('.answer')];buttons.forEach(b=>b.disabled=true);
if(choice===q.c){btn.classList.add('correct');score+=100;document.getElementById('score').textContent=score}else{btn.classList.add('wrong');buttons[q.c].classList.add('correct');lives--;document.getElementById('lives').textContent=lives}
results.push(choice===q.c);const f=document.getElementById('feedback');f.textContent=q.e;f.classList.add('show');document.getElementById('next').classList.add('show')}
function nextQuestion(){if(index<questions.length-1){index++;render()}else finish()}
function finish(){const correct=results.filter(Boolean).length,total=questions.length,pct=Math.round(correct/total*100);document.getElementById('bar').style.width='100%';
game.innerHTML='<div class="screen"><span class="badge">MISSÃO CONCLUÍDA</span><h1>Resultado final</h1><div class="result">'+correct+'/'+total+'</div><p class="sub">Você acertou <b>'+pct+'%</b> das questões e fez <b>'+score+'</b> pontos.</p><div class="review">'+(pct>=80?'Excelente! Matheus está mandando muito bem.':'Muito bom! Agora vale revisar as questões que deram trabalho e tentar novamente.')+'</div><button class="start" onclick="startGame()">JOGAR NOVAMENTE</button></div>'}
</script>
</body>
</html>
